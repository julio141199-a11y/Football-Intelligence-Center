name: FIC Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *" # 08:00 Asia/Seoul
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-update.yml"
      - "run_pipeline.py"
      - "config/source_access_overrides.json"
      - "config/career_profile.json"
      - "data/chat_opportunities.json"
      - "data.js"
      - "scripts/publish_action_summary.py"
      - "scripts/validate_pipeline.py"
      - "sources/sources.json"
      - "tests/test_fic.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: fic-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run daily pipeline
        run: python run_pipeline.py

      - name: Validate repository
        run: |
          python scripts/validate_pipeline.py
          python scripts/validate_repository.py
          pytest -q

      - name: Publish concise run summary
        id: alert
        env:
          FIC_ALERT_PATH: ${{ runner.temp }}/fic-alert.md
        run: python scripts/publish_action_summary.py

      - name: Notify only for new coaching candidates
        if: steps.alert.outputs.new_candidates != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "[FIC Alert] ${{ steps.alert.outputs.new_candidates }} new coaching candidate(s) — ${{ steps.alert.outputs.run_date }}" \
            --body-file "${{ runner.temp }}/fic-alert.md"

      - name: Commit generated data when changed
        run: |
          if git diff --quiet -- data/opportunities.json data/contacts.json data/social_sources.json data/updates.json; then
            echo "No generated data changes."
            exit 0
          fi

          git config user.name "fic-ai-employee"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json data/contacts.json data/social_sources.json data/updates.json
          git commit -m "FIC daily update: refresh opportunity watch"
          git push
