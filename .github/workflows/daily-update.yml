name: FIC Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *" # 08:00 Asia/Seoul

permissions:
  contents: write

concurrency:
  group: fic-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run daily pipeline
        run: python run_pipeline.py

      - name: Validate repository
        run: |
          python scripts/validate_pipeline.py
          python scripts/validate_repository.py
          pytest -q

      - name: Commit generated data when changed
        run: |
          if git diff --quiet -- data/opportunities.json data/updates.json; then
            echo "No generated data changes."
            exit 0
          fi

          git config user.name "fic-ai-employee"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json data/updates.json
          git commit -m "FIC daily update: refresh opportunity watch"
          git push
