name: FIC Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *" # 08:00 Asia/Seoul
    - cron: "0 9 * * *" # 18:00 Asia/Seoul
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-update.yml"
      - "run_pipeline.py"
      - "config/source_access_overrides.json"
      - "config/career_profile.json"
      - "config/decision_maker_markets.json"
      - "data/chat_opportunities.json"
      - "data/inbox/**"
      - "data/vacancies.json"
      - "data.js"
      - "scripts/publish_action_summary.py"
      - "scripts/validate_pipeline.py"
      - "scripts/vacancy_manager.py"
      - "scripts/import_chat_opportunities.py"
      - "scripts/import_chat_vacancies.py"
      - "scripts/update_decision_makers.py"
      - "scripts/validate_decision_makers.py"
      - "scripts/validate_vacancies.py"
      - "sources/sources.json"
      - "tests/test_fic.py"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: fic-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run daily pipeline
        run: |
          python run_pipeline.py
          python scripts/import_chat_vacancies.py --file data/chat_opportunities.json
          python scripts/import_chat_vacancies.py --inbox
          python scripts/vacancy_manager.py --pipeline
          python scripts/update_decision_makers.py

      - name: Validate repository
        run: |
          python scripts/validate_pipeline.py
          python scripts/validate_vacancies.py
          python scripts/validate_decision_makers.py
          python scripts/validate_repository.py
          pytest -q

      - name: Publish concise run summary
        id: alert
        env:
          FIC_ALERT_PATH: ${{ runner.temp }}/fic-alert.md
        run: python scripts/publish_action_summary.py

      - name: Notify only for new coaching candidates
        if: steps.alert.outputs.new_candidates != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "[FIC Alert] ${{ steps.alert.outputs.new_candidates }} new coaching candidate(s) — ${{ steps.alert.outputs.run_date }}" \
            --body-file "${{ runner.temp }}/fic-alert.md"

      - name: Commit generated data when changed
        run: |
          if git diff --quiet -- data/chat_opportunities.json data/opportunities.json data/contacts.json data/decision_makers.json data/social_sources.json data/updates.json data/vacancies.json data/vacancies_history.json data/archive/closed_vacancies.json data/logs/update_log.json data/logs/error_log.json; then
            echo "No generated data changes."
            exit 0
          fi

          git config user.name "fic-ai-employee"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chat_opportunities.json data/opportunities.json data/contacts.json data/decision_makers.json data/social_sources.json data/updates.json data/vacancies.json data/vacancies_history.json data/archive/closed_vacancies.json data/logs/update_log.json data/logs/error_log.json
          git commit -m "chore(vacancies): update reviewed coaching vacancies $(date -u +%F)"
          git pull --rebase origin main
          git push
