name: FIC Daily Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

concurrency:
  group: fic-daily-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Update deadline-derived fields
        run: python scripts/update_deadline_status.py

      - name: Validate repository
        run: python scripts/validate_repository.py

      - name: Run tests
        run: pytest -q

      - name: Commit verified maintenance changes
        run: |
          if git diff --quiet; then
            echo "No meaningful maintenance changes."
            exit 0
          fi

          git config user.name "fic-ai-employee"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git commit -m "FIC daily update: refresh deadline status"
          git push
